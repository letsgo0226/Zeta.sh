name: Empirical Metaphysics Bridge
on:
  push:
    paths:
      - 'Empirical_Metaphysics_TM.py'
      - 'EMPIRICAL_METAPHYSICS_MODEL.md'
      - '.github/workflows/empirical_metaphysics.yml'
  pull_request:
    paths:
      - 'Empirical_Metaphysics_TM.py'
      - 'EMPIRICAL_METAPHYSICS_MODEL.md'
      - '.github/workflows/empirical_metaphysics.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [empirical-metaphysics-evolve]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Static and self checks
        run: |
          python -m py_compile Empirical_Metaphysics_TM.py
          python Empirical_Metaphysics_TM.py self > self.json
          python Empirical_Metaphysics_TM.py omega > omega.json
          python - <<'PY'
          import json
          s=json.load(open('self.json')); o=json.load(open('omega.json'))
          assert s['SELF_SOLVED'] is True
          assert s['FORMAL_MODEL_ONLY'] is True
          assert o['OBSERVATIONAL_MAP_REQUIRED'] is True
          assert o['DATA_PROVENANCE_REQUIRED_FOR_SCIENTIFIC_USE'] is True
          assert o['PROVENANCE_VERIFIED'] is False
          assert o['EMPIRICAL_SCIENCE_VERIFIED'] is False
          assert o['ATTAINED_BY_FINITE_EXECUTION'] is False
          assert o['OPEN'] is True and o['FINAL'] is False
          PY
      - name: Likelihood and Bayes-factor checks
        run: |
          python Empirical_Metaphysics_TM.py compare --observable x --unit arb --value 10 --obs-sigma 1 --h1-mu 10 --h1-sigma 1 --h2-mu 14 --h2-sigma 1 --p1 1 --p2 1 --source synthetic-ci > compare.json
          python Empirical_Metaphysics_TM.py compare --observable x --unit arb --value 10 --obs-sigma 1 --h1-mu 10 --h1-sigma 1 --h2-mu 10 --h2-sigma 1 --p1 1 --p2 1 --source synthetic-ci > tie.json
          python - <<'PY'
          import json
          c=json.load(open('compare.json')); t=json.load(open('tie.json'))
          assert c['MODEL_COMPARISON_PERFORMED'] is True
          assert c['GAUSSIAN_ERROR_MODEL_ASSUMED'] is True
          assert c['INDEPENDENT_UNCERTAINTIES_ASSUMED'] is True
          assert abs(c['LOG_BF_12']-4.0)<1e-12
          assert c['H1']['posterior_two_model']>0.98
          assert c['PROVENANCE_VERIFIED'] is False
          assert c['EMPIRICAL_SCIENCE_VERIFIED'] is False
          assert c['PHYSICAL_REALITY_VERIFIED'] is False
          assert c['FORMAL_POSSIBILITY_EQUALS_PHYSICAL_REALITY'] is False
          assert abs(t['LOG_BF_12'])<1e-12
          assert abs(t['H1']['posterior_two_model']-.5)<1e-12
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: empirical-metaphysics-state
          path: |
            self.json
            omega.json
            compare.json
            tie.json
