name: Universal Continuity Research

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      subject:
        description: 'bio or ai'
        required: false
        default: 'bio'
      constraints:
        description: 'V,C,R,W,A,N as six bits'
        required: false
        default: '111111'
      evidence:
        description: 'physics, provenance, uncertainty, identity evidence as four bits'
        required: false
        default: '1111'
  repository_dispatch:
    types: [continuity-evolve]

permissions:
  contents: read

concurrency:
  group: continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify compact machine
        run: |
          b=$(wc -c < Universal_Continuity_TM.sh)
          echo "bytes=$b"
          test "$b" -lt 2048
          bash -n Universal_Continuity_TM.sh
          chmod +x Universal_Continuity_TM.sh
      - name: Verify self and symbolic boundary
        run: |
          ./Universal_Continuity_TM.sh self > self.json
          ./Universal_Continuity_TM.sh > omega.json
          python3 - <<'PY'
          import json
          s=json.load(open('self.json'));o=json.load(open('omega.json'))
          assert s['SELF_SOLVED'] and o['SELF_SOLVED']
          assert o['RISK_NUM']==0 and o['HAZARD_TARGET']==0 and o['RESIDUAL']==0
          assert o['IDENTITY_ENTROPY']==0 and o['PHYSICAL_FEASIBLE'] and o['INFORMATION_GATE']
          assert not o['THERMODYNAMIC_ZERO_ENTROPY']
          assert o['BOUNDARY_BY_DEFINITION'] and not o['ATTAINED_BY_FINITE_EXECUTION']
          assert not o['REAL_WORLD_VERIFIED'] and o['FORMAL_MODEL_ONLY']
          assert o['OPEN'] and not o['FINAL']
          PY
      - name: Verify exact finite risk path
        run: |
          ./Universal_Continuity_TM.sh finite 4 > finite.json
          python3 - <<'PY'
          import json
          x=json.load(open('finite.json'))
          assert x['RISK_NUM']==1 and x['RISK_DEN']==16
          assert x['HAZARD_BOUND_NUM']==1 and x['HAZARD_BOUND_DEN']==16
          assert x['RESIDUAL_BOUND_NUM']==1 and x['RESIDUAL_BOUND_DEN']==16
          PY
      - name: Verify biological and artificial assessments
        run: |
          ./Universal_Continuity_TM.sh assess bio 111111 1111 > bio.json
          ./Universal_Continuity_TM.sh assess ai 101111 1111 > ai.json
          python3 - <<'PY'
          import json
          b=json.load(open('bio.json'));a=json.load(open('ai.json'))
          assert b['ZERO_RESIDUAL'] and b['IDENTITY_ENTROPY']==0
          assert b['PHYSICAL_FEASIBLE'] and b['PROVENANCE_COMPLETE'] and b['UNCERTAINTY_BOUNDED'] and b['IDENTITY_EVIDENCE']
          assert not b['THERMODYNAMIC_ZERO_ENTROPY'] and not b['REAL_WORLD_VERIFIED']
          assert not a['ZERO_RESIDUAL'] and a['RESIDUAL']==1 and a['SENTIENCE_ASSUMED'] is False
          PY
      - name: Assess requested research state
        env:
          SUBJECT: ${{ github.event.inputs.subject }}
          CONSTRAINTS: ${{ github.event.inputs.constraints }}
          EVIDENCE: ${{ github.event.inputs.evidence }}
        run: |
          S="$SUBJECT"; C="$CONSTRAINTS"; E="$EVIDENCE"
          [ -n "$S" ] || S=bio
          [ -n "$C" ] || C=111111
          [ -n "$E" ] || E=1111
          ./Universal_Continuity_TM.sh assess "$S" "$C" "$E" > assessment.json
          cat assessment.json
      - uses: actions/upload-artifact@v4
        with:
          name: continuity-${{ github.run_id }}
          path: |
            self.json
            omega.json
            finite.json
            bio.json
            ai.json
            assessment.json
