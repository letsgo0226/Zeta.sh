name: Leibniz Calculemus Meta One-Liner
on:
  push:
    paths:
      - 'Leibniz_Calculemus_Meta_OneLiner.sh'
      - '.github/workflows/leibniz_calculemus_meta_oneliner.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-line size boundary
        run: |
          test "$(wc -l < Leibniz_Calculemus_Meta_OneLiner.sh)" -eq 1
          test "$(wc -c < Leibniz_Calculemus_Meta_OneLiner.sh)" -lt 2048
      - name: Verify exact source quine
        run: |
          sh Leibniz_Calculemus_Meta_OneLiner.sh quine > /tmp/quine.sh
          cmp -s Leibniz_Calculemus_Meta_OneLiner.sh /tmp/quine.sh
      - name: Run all-goals finite prefix
        run: |
          sh Leibniz_Calculemus_Meta_OneLiner.sh 4 3 5 omega > /tmp/all.json
      - name: Verify monad, harmony, meta-XY and omega boundaries
        run: |
          python3 - <<'PY'
          import json,pathlib
          a=json.load(open('/tmp/all.json'))
          assert a['mode']=='LEIBNIZ_GODEL_ALL_GOALS' and a['calculemus']==1
          assert a['source_quine_exact'] is True and a['self_godel_exact'] is True
          assert a['monad']=={'simple':1,'nonextended':1,'formal_nonphysical':1,'windowless':1}
          assert a['harmony']['causal_influx']==0 and isinstance(a['harmony']['common_law'],int)
          assert a['meta_xy']=="G->X->zeta(X)->G'"
          assert a['log_spectrum']=='log_k(k^-X)=-X,k>=2'
          assert a['computable_universe_prefix']==5
          assert a['identity_exact']==1 and a['analytic_projection_lossy']==1
          assert len(a['runs'])==3 and all(len(h)==4 for h in a['runs'])
          assert all(len(layer[4])==5 for h in a['runs'] for layer in h)
          assert a['omega']=={'symbolic':True,'finite_execution':0}
          assert a['open']==1 and a['final']==0
          p=pathlib.Path('Leibniz_Calculemus_Meta_OneLiner.sh').read_bytes()
          assert a['physical_map']['source_bytes']==len(p)<2048
          assert a['physical_map']['metaphysical_identity_proved']==0
          assert p.count(b'\n')==1
          PY
