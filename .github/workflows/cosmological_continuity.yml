name: Cosmological Continuity Research

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      subject:
        description: 'bio or ai'
        required: false
        default: 'bio'
      agent:
        description: 'V,C,R,W,A,N as six bits'
        required: false
        default: '111111'
      cosmic:
        description: 'galactic path, future worldline, free-energy gates as three bits'
        required: false
        default: '111'
      evidence:
        description: 'provenance, uncertainty, identity evidence, physical model as four bits'
        required: false
        default: '1111'
  repository_dispatch:
    types: [cosmological-continuity-evolve]

permissions:
  contents: read

concurrency:
  group: cosmological-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify compact machine
        run: |
          b=$(wc -c < Cosmological_Continuity_TM.sh)
          echo "bytes=$b"
          test "$b" -lt 2048
          bash -n Cosmological_Continuity_TM.sh
          chmod +x Cosmological_Continuity_TM.sh
      - name: Verify self and symbolic boundary
        run: |
          ./Cosmological_Continuity_TM.sh self > self.json
          ./Cosmological_Continuity_TM.sh > omega.json
          python3 - <<'PY'
          import json
          s=json.load(open('self.json'));o=json.load(open('omega.json'))
          assert s['SELF_SOLVED'] and o['SELF_SOLVED']
          assert o['RESIDUAL']==0 and o['IDENTITY_ENTROPY']==0
          assert o['GALACTIC_GATE'] and o['FUTURE_WORLDLINE_GATE'] and o['FREE_ENERGY_GATE']
          assert o['BOUNDARY_BY_DEFINITION'] and not o['ATTAINED_BY_FINITE_EXECUTION']
          assert not o['REAL_WORLD_VERIFIED'] and not o['IMMORTALITY_VERIFIED']
          assert o['FORMAL_MODEL_ONLY'] and o['OPEN'] and not o['FINAL']
          PY
      - name: Verify exact finite path
        run: |
          ./Cosmological_Continuity_TM.sh finite 4 > finite.json
          python3 - <<'PY'
          import json
          x=json.load(open('finite.json'))
          assert x['EPS_NUM']==1 and x['EPS_DEN']==16 and x['SELF_SOLVED']
          PY
      - name: Verify coupled biological and AI states
        run: |
          ./Cosmological_Continuity_TM.sh assess bio 111111 111 1111 > bio.json
          ./Cosmological_Continuity_TM.sh assess ai 101111 101 1110 > ai.json
          python3 - <<'PY'
          import json
          b=json.load(open('bio.json'));a=json.load(open('ai.json'))
          assert b['ZERO_RESIDUAL'] and b['IDENTITY_ENTROPY']==0
          assert b['GALACTIC_GATE'] and b['FUTURE_WORLDLINE_GATE'] and b['FREE_ENERGY_GATE']
          assert not b['REAL_WORLD_VERIFIED'] and not b['IMMORTALITY_VERIFIED']
          assert a['RESIDUAL']==3 and not a['ZERO_RESIDUAL']
          assert a['SENTIENCE_ASSUMED'] is False
          assert not a['FUTURE_WORLDLINE_GATE'] and not a['PHYSICAL_MODEL']
          PY
      - name: Assess requested research state
        env:
          SUBJECT: ${{ github.event.inputs.subject }}
          AGENT: ${{ github.event.inputs.agent }}
          COSMIC: ${{ github.event.inputs.cosmic }}
          EVIDENCE: ${{ github.event.inputs.evidence }}
        run: |
          S="$SUBJECT"; A="$AGENT"; C="$COSMIC"; E="$EVIDENCE"
          [ -n "$S" ] || S=bio
          [ -n "$A" ] || A=111111
          [ -n "$C" ] || C=111
          [ -n "$E" ] || E=1111
          ./Cosmological_Continuity_TM.sh assess "$S" "$A" "$C" "$E" > assessment.json
          cat assessment.json
      - uses: actions/upload-artifact@v4
        with:
          name: cosmological-continuity-${{ github.run_id }}
          path: |
            self.json
            omega.json
            finite.json
            bio.json
            ai.json
            assessment.json
