name: Zeta TM One-Liner

on:
  workflow_dispatch:
  push:
    paths:
      - 'Zeta_TM_OneLiner.sh'
      - '.github/workflows/zeta_tm_oneliner.yml'
  pull_request:
    paths:
      - 'Zeta_TM_OneLiner.sh'
      - '.github/workflows/zeta_tm_oneliner.yml'

permissions:
  contents: read

jobs:
  one-liner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify one-line size boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          b=Path('Zeta_TM_OneLiner.sh').read_bytes()
          assert len(b)<2048,len(b)
          assert b.rstrip(b'\n').count(b'\n')==0
          print('bytes=',len(b))
          PY
      - name: Run self-Godel-X-Y, paste, X/Y and exact-log modes
        run: |
          sh Zeta_TM_OneLiner.sh > self.json
          sh Zeta_TM_OneLiner.sh 0 8 > cycle.json
          sh Zeta_TM_OneLiner.sh 21 1 > zero.json
          sh Zeta_TM_OneLiner.sh log 72 75 > log.json
          mkdir -p /tmp/zeta-tm-test
          (cd /tmp/zeta-tm-test && sh "$GITHUB_WORKSPACE/Zeta_TM_OneLiner.sh" > "$GITHUB_WORKSPACE/away.json")
          cat Zeta_TM_OneLiner.sh | sh > paste.json
      - name: Verify exact self channel and analytic projection boundaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          S=json.load(open('self.json'));A=json.load(open('away.json'));P=json.load(open('paste.json'));C=json.load(open('cycle.json'));Z=json.load(open('zero.json'));L=json.load(open('log.json'))
          src=Path('Zeta_TM_OneLiner.sh').read_bytes()
          for x in (S,A):
            assert x['mode']=='decode-self' and x['byte_roundtrip'] is True and x['source_exact'] is True
            assert x['decoded'].encode()==src and x['index']==int(x['self'],16)%1000003
            assert len(x['X'])==2 and x['Y']['k'] in ('pole','zero','num') and x['zeta_inverse'] is False
            assert x['open'] is True and x['final'] is False
          assert P['mode']=='decode-self' and P['byte_roundtrip'] is True and P['source_exact'] is False
          assert P['decoded']=='Zeta_TM_OneLiner.sh|PASTE' and P['index']==int(P['self'],16)%1000003 and P['zeta_inverse'] is False
          assert C['mode']=='xy' and C['dense'] is True and C['closure_C'] is True and C['full_C'] is False
          p=next(x for x in C['cycle'] if x['n']==1)
          assert p['X']==[[1,1],[0,1]] and p['Y']=={'k':'pole','r':1,'l':0}
          z=Z['cycle'][0]
          assert z['n']==21 and z['X']==[[-2,1],[0,1]] and z['Y']=={'k':'zero','v':0}
          assert L['mode']=='exact-log' and L['exact'] is True and L['ab']==5400
          assert L['log_a']=={'2':3,'3':2} and L['log_b']=={'3':1,'5':2} and L['log_ab']=={'2':3,'3':3,'5':2}
          print('SELF -> Godel -> X -> Y with exact SELF round-trip checks passed')
          PY
