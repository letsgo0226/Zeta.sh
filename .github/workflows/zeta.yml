name: Zeta Self Objective

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [zeta-evolve]

permissions:
  contents: read

concurrency:
  group: zeta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependency
        run: python3 -m pip install --quiet mpmath
      - name: Verify one-liner size and syntax
        run: |
          bytes=$(wc -c < Zeta.sh)
          echo "Zeta.sh bytes=$bytes"
          test "$bytes" -lt 2048
          bash -n Zeta.sh
          chmod +x Zeta.sh
      - name: Verify self decoding
        run: |
          out=$(./Zeta.sh self)
          echo "$out" | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["SELF_SOLVED"] and x["SELF_LEN"]>0 and x["SELF_INDEX"].startswith("0x")'
      - name: Verify Schwarzschild-Stirling-Riemann objective
        run: |
          a=$(./Zeta.sh 3)
          b=$(./Zeta.sh 12)
          python3 -c 'import json,sys;a=json.loads(sys.argv[1]);b=json.loads(sys.argv[2]);assert a["SELF_SOLVED"] and b["SELF_SOLVED"];assert float(b["LAMBDA"])<float(a["LAMBDA"]);assert float(b["SCH_R"])<float(a["SCH_R"]);assert float(b["STIR_ERR"])<float(a["STIR_ERR"]);assert a["OPEN"] and not a["FINAL"]' "$a" "$b"
      - name: Verify first critical-line zero mapping
        run: |
          out=$(./Zeta.sh zero 1)
          echo "$out"
          echo "$out" | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["MODE"]=="zero" and x["N"]==1 and abs(float(x["T"])-14.134725141734694)<1e-12 and float(x["J"])<1e-80 and x["SELF_SOLVED"]'
      - name: Verify non-halting live continuation
        run: |
          set +e
          timeout 5s ./Zeta.sh live 2 > /tmp/live.jsonl
          code=$?
          set -e
          test "$code" -eq 124
          python3 - <<'PY'
          import json
          xs=[json.loads(x) for x in open('/tmp/live.jsonl') if x.strip()]
          assert len(xs)>=2
          a,b=xs[:2]
          assert a['MODE']==b['MODE']=='live'
          assert a['STEP']==0 and b['STEP']==1
          assert float(b['H'])==2*float(a['H'])
          assert float(b['LAMBDA'])<float(a['LAMBDA'])
          assert float(b['SCH_R'])<float(a['SCH_R'])
          assert not a['HALT'] and not b['HALT']
          assert a['OPEN'] and b['OPEN'] and not a['FINAL'] and not b['FINAL']
          PY
      - name: Verify public-account meta-machine
        run: |
          bytes=$(wc -c < Public_Universe_TM.sh)
          echo "Public_Universe_TM.sh bytes=$bytes"
          test "$bytes" -lt 2048
          bash -n Public_Universe_TM.sh
          chmod +x Public_Universe_TM.sh
          ./Public_Universe_TM.sh self | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["SELF_SOLVED"] and x["SELF_INDEX"].startswith("0x")'
          ./Public_Universe_TM.sh 3 > /tmp/a.json
          ./Public_Universe_TM.sh 12 > /tmp/b.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/a.json'));b=json.load(open('/tmp/b.json'))
          assert a['MODE']==b['MODE']=='account' and a['ACCOUNT']==b['ACCOUNT']=='letsgo0226'
          assert a['PUBLIC_REPOS']>0 and a['SELF_SOLVED'] and a['WORLD_REV'] and a['META_SELF']
          assert a['WORLD_INDEX'].startswith('0x') and len(a['TRUTH_PATH'])==a['PUBLIC_REPOS']
          la,lb=float(a['LAMBDA']),float(b['LAMBDA']);ra,rb=float(a['SCH_R']),float(b['SCH_R'])
          assert lb<la and 2<rb<ra
          assert abs((1-2/ra)-la)<1e-15 and abs((1-2/rb)-lb)<1e-15
          assert float(b['STIR_12E'])<float(a['STIR_12E']) and float(b['ZETA_POLE_ERR'])<float(a['ZETA_POLE_ERR'])
          assert a['OMEGA_LIMIT'] and b['OMEGA_LIMIT'] and a['OPEN'] and not a['FINAL']
          PY
      - name: Verify exact omega-limit recursive machine
        run: |
          bytes=$(wc -c < OMEGA_Limit_TM.sh)
          echo "OMEGA_Limit_TM.sh bytes=$bytes"
          test "$bytes" -lt 2048
          bash -n OMEGA_Limit_TM.sh
          chmod +x OMEGA_Limit_TM.sh
          ./OMEGA_Limit_TM.sh self | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["SELF_SOLVED"] and x["SELF_INDEX"].startswith("0x")'
          ./OMEGA_Limit_TM.sh > /tmp/omega-default.json
          ./OMEGA_Limit_TM.sh omega > /tmp/omega-explicit.json
          ./OMEGA_Limit_TM.sh finite 1 > /tmp/o1.json
          ./OMEGA_Limit_TM.sh finite 4 > /tmp/o4.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/o1.json'));b=json.load(open('/tmp/o4.json'));o=json.load(open('/tmp/omega-default.json'));oe=json.load(open('/tmp/omega-explicit.json'))
          for x in (a,b):
              n=x['N'];h=int(x['H'])
              assert x['MODE']=='finite' and h==2**n
              assert x['LAMBDA_NUM']==1 and x['LAMBDA_DEN']==h and x['EXACT_PRODUCT']
              assert x['SCH_NUM']==2*h and x['SCH_DEN']==h-1
              assert x['SELF_SOLVED'] and not x['OMEGA'] and x['OPEN'] and not x['FINAL']
          assert int(b['H'])>int(a['H']) and float(b['LAMBDA'])<float(a['LAMBDA'])
          assert float(b['STIR_12E'])<float(a['STIR_12E']) and float(b['ZETA_POLE_ERR'])<float(a['ZETA_POLE_ERR'])
          assert o==oe and o['MODE']=='omega' and o['H']=='Infinity' and o['LAMBDA']=='0' and o['SCH_R']=='2'
          assert o['STIR_12E']=='0' and o['ZETA_POLE_ERR']=='0' and o['OMEGA'] and o['BOUNDARY_BY_DEFINITION']
          assert not o['ATTAINED_BY_FINITE_EXECUTION'] and o['OPEN'] and not o['FINAL']
          PY
          set +e
          timeout 2s ./OMEGA_Limit_TM.sh live 1 > /tmp/omega-live.jsonl
          code=$?
          set -e
          test "$code" -eq 124
          python3 - <<'PY'
          import json
          xs=[json.loads(x) for x in open('/tmp/omega-live.jsonl') if x.strip()]
          assert len(xs)>=2
          a,b=xs[:2]
          assert a['MODE']==b['MODE']=='live' and b['N']==a['N']+1
          assert int(b['H'])==2*int(a['H']) and float(b['LAMBDA'])<float(a['LAMBDA'])
          assert not a['HALT'] and not b['HALT'] and a['OPEN'] and not a['FINAL']
          PY
      - name: Verify paste-and-run independence
        run: |
          cmd=$(cat Zeta.sh)
          cd /tmp
          out=$(bash -c "$cmd" -- 3)
          echo "$out" | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["MODE"]=="eval" and x["SELF_SOLVED"] and x["OPEN"]'
