name: PAQS Research
on:
  push:
    paths:
      - 'Spectral_Core_TM.sh'
      - 'Quiet_Control_TM.py'
      - 'Safety_Guard_TM.py'
      - 'PAQS_Supervisor.py'
      - 'FxLMS_DSP.py'
      - 'Safety_MCU_Model.py'
      - 'BLE_Control_Contract.py'
      - 'PAQS_MODEL.md'
      - '.github/workflows/paqs.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [paqs-evolve]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check mpmath
      - name: Static checks
        run: |
          bash -n Spectral_Core_TM.sh
          python -m py_compile Quiet_Control_TM.py Safety_Guard_TM.py PAQS_Supervisor.py FxLMS_DSP.py Safety_MCU_Model.py BLE_Control_Contract.py
      - name: Spectral formal plane
        run: |
          chmod +x Spectral_Core_TM.sh
          ./Spectral_Core_TM.sh self > self.json
          ./Spectral_Core_TM.sh finite 4 > finite.json
          ./Spectral_Core_TM.sh omega > omega.json
          python - <<'PY'
          import json
          s=json.load(open('self.json')); f=json.load(open('finite.json')); o=json.load(open('omega.json'))
          assert s['SELF_SOLVED'] is True
          assert f['LAMBDA_NUM']==1 and f['LAMBDA_DEN']==16
          assert o['BOUNDARY_BY_DEFINITION'] is True and o['ATTAINED_BY_FINITE_EXECUTION'] is False
          assert o['OPEN'] is True and o['FINAL'] is False
          PY
      - name: Independent planes and hard veto
        run: |
          python Quiet_Control_TM.py assess 62 34 1 1 > acoustic.json
          python Safety_Guard_TM.py assess 1 1 1 1 0 > safe.json
          python Safety_Guard_TM.py assess 1 1 1 1 1 > emergency.json
          python Safety_Guard_TM.py assess 1 1 0 1 0 > alarm_fault.json
          python PAQS_Supervisor.py assess 62 34 1 1 1 1 1 1 0 > run.json
          python PAQS_Supervisor.py assess 62 34 1 1 1 1 1 1 1 > veto.json
          python - <<'PY'
          import json
          a=json.load(open('acoustic.json')); s=json.load(open('safe.json')); e=json.load(open('emergency.json')); q=json.load(open('alarm_fault.json')); r=json.load(open('run.json')); v=json.load(open('veto.json'))
          assert a['ACTUATOR_REQUEST'] is True and a['SAFETY_AUTHORITY'] is False
          assert s['ANC_ALLOWED'] is True and s['APP_CAN_OVERRIDE'] is False
          assert e['ANC_ALLOWED'] is False and e['HARD_VETO'] is True
          assert q['ANC_ALLOWED'] is False and q['HARD_VETO'] is True
          assert r['ACTUATE'] is True and r['APP_CAN_BYPASS_SAFETY'] is False
          assert v['ACTUATE'] is False and v['SAFETY_VETO'] is True
          assert v['ABSOLUTE_SAFETY_VERIFIED'] is False and v['REAL_WORLD_VERIFIED'] is False
          PY
      - name: Local FxLMS and MCU interlock stage
        run: |
          python FxLMS_DSP.py simulate 80 2 2000 > fxlms.json
          python Safety_MCU_Model.py assess 1 1 1 1 1 0 20 > mcu_ok.json
          python Safety_MCU_Model.py assess 1 1 1 1 1 1 20 > mcu_emergency.json
          python Safety_MCU_Model.py assess 1 1 1 1 1 0 300 > mcu_timeout.json
          python BLE_Control_Contract.py validate '{"op":"set_mode","value":"meditation"}' > ble_ok.json
          python BLE_Control_Contract.py validate '{"op":"amp_enable","value":true}' > ble_denied.json
          python - <<'PY'
          import json
          from Safety_MCU_Model import SafetyInterlock
          f=json.load(open('fxlms.json')); a=json.load(open('mcu_ok.json')); e=json.load(open('mcu_emergency.json')); t=json.load(open('mcu_timeout.json')); b=json.load(open('ble_ok.json')); d=json.load(open('ble_denied.json'))
          assert f['IMPROVED'] is True and f['SAFETY_AUTHORITY'] is False and f['HARDWARE_IO'] is False
          assert a['AMP_ENABLE'] is True and a['APP_CAN_OVERRIDE'] is False
          assert e['AMP_ENABLE'] is False and e['AMP_DISABLE_ASSERTED'] is True
          assert t['HEARTBEAT_OK'] is False and t['AMP_ENABLE'] is False
          assert b['ACCEPTED'] is True and b['CONFIGURATION_ONLY'] is True
          assert d['ACCEPTED'] is False and d['REASON']=='SAFETY_AUTHORITY_FORBIDDEN'
          i=SafetyInterlock(); i.evaluate(True,True,True,True,True,True,0); z=i.evaluate(True,True,True,True,True,False,0)
          assert z['EMERGENCY_LATCH'] is True and z['AMP_ENABLE'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paqs-research-state
          path: |
            self.json
            finite.json
            omega.json
            acoustic.json
            safe.json
            emergency.json
            alarm_fault.json
            run.json
            veto.json
            fxlms.json
            mcu_ok.json
            mcu_emergency.json
            mcu_timeout.json
            ble_ok.json
            ble_denied.json
