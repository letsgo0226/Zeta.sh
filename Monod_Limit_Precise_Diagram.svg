<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020817"/><stop offset="1" stop-color="#071c38"/></linearGradient><style>text{font-family:Arial,sans-serif;fill:#eaf7ff}.H{font-size:38px;font-weight:700}.S{font-size:19px;fill:#9edfff}.T{font-size:23px;font-weight:700;fill:#ffe89b}.B{font-size:17px}.M{font-family:monospace;font-size:17px;fill:#a9efff}.box{fill:#061426;stroke:#31c8ff;stroke-width:2}.node{fill:#0a2c4b;stroke:#8ce9ff;stroke-width:2}.gold{fill:#101b2d;stroke:#ffe184;stroke-width:2}.arr{stroke:#62dcff;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#ffe184;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#g)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#62dcff"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#ffe184"/></marker></defs><rect width="1800" height="1220" fill="url(#bg)"/><text x="900" y="55" text-anchor="middle" class="H">Monod.sh — Precise Limit Semantics</text><text x="900" y="88" text-anchor="middle" class="S">Finite execution · Meta X/Y · ω boundary · inverse limit · fixed-point distinctions · physical realization</text><g transform="translate(45 125)"><rect class="box" width="820" height="250" rx="18"/><text x="25" y="40" class="T">1 · Finite executable prefix</text><g transform="translate(30 78)"><rect class="node" width="120" height="58" rx="10"/><rect class="node" x="185" width="120" height="58" rx="10"/><rect class="node" x="370" width="120" height="58" rx="10"/><rect class="node" x="555" width="120" height="58" rx="10"/><text x="60" y="37" text-anchor="middle" class="T">M₀</text><text x="245" y="37" text-anchor="middle" class="T">M₁</text><text x="430" y="37" text-anchor="middle" class="T">M₂</text><text x="615" y="37" text-anchor="middle" class="T">Mₙ</text><path class="arr" d="M120 29H180"/><path class="arr" d="M305 29H365"/><path class="arr" d="M490 29H550"/></g><text x="25" y="175" class="M">∀ N &lt; ω : prefix M₀ → … → Mₙ is finitely generable</text><text x="25" y="210" class="B">An actual run never performs an infinite number of transitions.</text></g><g transform="translate(910 125)"><rect class="box" width="845" height="250" rx="18"/><text x="25" y="40" class="T">2 · Exact identity channel vs analytic projection</text><text x="30" y="88" class="M">Gₙ₊₁ = E_meta(Gₙ, Xₙ, Yₙ^formal, Tₙ)</text><text x="30" y="126" class="M">Xₙ = φ(Gₙ)        Yₙ = ζ(Xₙ)</text><path class="arr" d="M55 165H220"/><path class="arr" d="M285 165H450"/><path class="arr" d="M515 165H680"/><text x="55" y="198" class="B">Gₙ</text><text x="285" y="198" class="B">Xₙ</text><text x="515" y="198" class="B">Yₙ</text><text x="680" y="198" class="B">Gₙ₊₁</text><text x="30" y="230" class="S">Reversible meta-history ≠ lossy φ / numerical ζ projection.</text></g><g transform="translate(45 410)"><rect class="box" width="820" height="300" rx="18"/><text x="25" y="40" class="T">3 · ω is a formal boundary, not a final iteration</text><circle class="node" cx="105" cy="135" r="46"/><circle class="node" cx="255" cy="135" r="46"/><circle class="node" cx="405" cy="135" r="46"/><text x="105" y="143" text-anchor="middle" class="T">M₀</text><text x="255" y="143" text-anchor="middle" class="T">M₁</text><text x="405" y="143" text-anchor="middle" class="T">…</text><circle class="gold" cx="650" cy="135" r="76"/><text x="650" y="148" text-anchor="middle" class="H">Mω</text><path class="arr" d="M151 135H204"/><path class="arr" d="M301 135H354"/><path class="dash" d="M455 135H570"/><text x="25" y="238" class="M">Mω := colimₙ&lt;ω Mₙ   (when embeddings form a directed system)</text><text x="25" y="272" class="B">For every finite N: Mω ≠ Mₙ.  attained_by_finite_execution = false</text></g><g transform="translate(910 410)"><rect class="box" width="845" height="300" rx="18"/><text x="25" y="40" class="T">4 · Universe inverse limit requires compatibility</text><circle class="node" cx="100" cy="130" r="50"/><circle class="node" cx="245" cy="130" r="50"/><circle class="node" cx="390" cy="130" r="50"/><circle class="gold" cx="660" cy="130" r="80"/><text x="100" y="138" text-anchor="middle" class="T">X₀(P)</text><text x="245" y="138" text-anchor="middle" class="T">X₁(P)</text><text x="390" y="138" text-anchor="middle" class="T">X₂(P)</text><text x="660" y="140" text-anchor="middle" class="H">ΩP</text><path class="dash" d="M440 130H575"/><text x="25" y="225" class="M">ΩP = lim← Xᵢ(P) = {(xᵢ): πⱼᵢ(xⱼ)=xᵢ}</text><text x="25" y="262" class="B">A list of worlds alone does not imply an inverse limit; maps πⱼᵢ and compatibility are required.</text></g><g transform="translate(45 750)"><rect class="box" width="1110" height="285" rx="18"/><text x="25" y="40" class="T">5 · Three different notions of “return / fixed point”</text><rect class="node" x="30" y="78" width="315" height="145" rx="14"/><rect class="node" x="395" y="78" width="315" height="145" rx="14"/><rect class="node" x="760" y="78" width="315" height="145" rx="14"/><text x="188" y="115" text-anchor="middle" class="T">Source / Gödel return</text><text x="188" y="158" text-anchor="middle" class="M">D(E(S)) = S</text><text x="188" y="194" text-anchor="middle" class="B">exact syntactic identity</text><text x="553" y="115" text-anchor="middle" class="T">Kleene fixed point</text><text x="553" y="158" text-anchor="middle" class="M">φₑ = φ_F(e)</text><text x="553" y="194" text-anchor="middle" class="B">program-semantic</text><text x="918" y="115" text-anchor="middle" class="T">ζ analytic fixed point</text><text x="918" y="158" text-anchor="middle" class="M">ζ(s) = s</text><text x="918" y="194" text-anchor="middle" class="B">complex analytic</text><text x="555" y="258" text-anchor="middle" class="S">None of these equations proves either of the others.</text></g><g transform="translate(1200 750)"><rect class="box" width="555" height="285" rx="18"/><text x="25" y="40" class="T">6 · Physical realization boundary</text><text x="25" y="88" class="M">R : 𝔐 → O_physical</text><path class="arr" d="M70 130H430"/><text x="25" y="176" class="B">Formal monad / Ω becomes empirical only through</text><text x="25" y="204" class="B">specified observables, predictions and measurements.</text><text x="25" y="250" class="S">formal fixed point ≠ physical fundamentality</text></g><g transform="translate(45 1075)"><rect class="gold" width="1710" height="105" rx="16"/><text x="855" y="38" text-anchor="middle" class="T">LIMIT PRINCIPLE</text><text x="855" y="70" text-anchor="middle" class="M">FINITE_PREFIX = computable · Ω = symbolic/formal boundary · OPEN = true · FINAL = false</text><text x="855" y="94" text-anchor="middle" class="B">A numerical limit additionally requires a topology, metric, order, or other explicit convergence structure.</text></g></svg>