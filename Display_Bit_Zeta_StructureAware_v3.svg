<text x="35" y="165" fill="#f4fbff" font-size="20" font-family="serif">ζ(s) = Σ 1/nˢ   (Re(s) &gt; 1)</text><text x="35" y="199" fill="#f4fbff" font-size="17" font-family="serif">H(s) = (s−1)ζ(s)</text><text x="35" y="233" fill="#f4fbff" font-size="17" font-family="serif">H(1)=1</text><text x="35" y="267" fill="#f4fbff" font-size="17" font-family="serif">log 1 = 0  →  2</text>
<text x="335" y="165" fill="#f4fbff" font-size="20" font-family="serif">E : {0,1}* → ℕ</text><text x="335" y="199" fill="#f4fbff" font-size="17" font-family="serif">G = E(P)</text><text x="335" y="233" fill="#f4fbff" font-size="17" font-family="serif">D(G) = P</text><text x="335" y="267" fill="#f4fbff" font-size="17" font-family="serif">D(E(P)) = P</text>
<text x="610" y="170" fill="#f4fbff" font-size="20" font-family="serif">M : (Σ, δ)</text><text x="610" y="204" fill="#f4fbff" font-size="17" font-family="serif">in → δ → out</text><text x="610" y="238" fill="#f4fbff" font-size="17" font-family="serif">closed · deterministic · windowless</text>
<text x="875" y="165" fill="#f4fbff" font-size="20" font-family="serif">X = discrete structural state</text><text x="875" y="199" fill="#f4fbff" font-size="17" font-family="serif">Y = ζ(X)</text><text x="875" y="233" fill="#f4fbff" font-size="17" font-family="serif">X ≠ Y</text><text x="875" y="267" fill="#f4fbff" font-size="17" font-family="serif">structure ≠ spectrum</text>
<text x="1160" y="165" fill="#f4fbff" font-size="20" font-family="serif">Z(s) = Σ bₙ/nˢ</text><text x="1160" y="199" fill="#f4fbff" font-size="17" font-family="serif">V(s) = Σ bₙuₙ/nˢ</text><text x="1160" y="233" fill="#f4fbff" font-size="17" font-family="serif">bₙ ∈ {0,1}</text><text x="1160" y="267" fill="#f4fbff" font-size="17" font-family="serif">n = display-bit address</text>
<text x="35" y="458" fill="#f4fbff" font-size="20" font-family="serif">n⁻ˢ = e⁻ˢlog n</text><text x="35" y="492" fill="#f4fbff" font-size="17" font-family="serif">rₙ = n⁻σ</text><text x="35" y="526" fill="#f4fbff" font-size="17" font-family="serif">θₙ = −t log n</text><text x="35" y="560" fill="#f4fbff" font-size="17" font-family="serif">xₙ=x₀+λbₙrₙcosθₙ</text><text x="35" y="594" fill="#f4fbff" font-size="17" font-family="serif">yₙ=y₀−λbₙrₙsinθₙ</text>
